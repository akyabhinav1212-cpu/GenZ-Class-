<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class+ | School Learning Platform</title>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<!-- LOGO -->
<link rel="icon" href="logo.png">

<!-- FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#dff3ff,#f8fbff,#eef4ff);
}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
}

/* LOGO */
.logo{
    font-size:28px;
    font-weight:800;
    color:#0ea5e9;
}

.logo span{
    color:#0b3a6a;
}

/* HERO */
.hero{
    text-align:center;
    padding:50px 20px 20px;
}

.hero h1{
    font-size:48px;
    color:#0b3a6a;
    font-weight:800;
}

.hero p{
    margin-top:10px;
    font-size:18px;
    color:#555;
    max-width:750px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.7;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    padding:40px 8%;
}

/* CLASS CARD */
.card{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(12px);
    border-radius:22px;
    padding:25px;
    text-align:center;
    text-decoration:none;
    color:#0b3a6a;
    box-shadow:0 8px 20px rgba(0,0,0,0.08);
    transition:0.3s ease;
    position:relative;
    overflow:hidden;
}

/* glow */
.card::before{
    content:"";
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:radial-gradient(circle, rgba(14,165,233,0.15), transparent 60%);
    transform:rotate(25deg);
}

/* hover */
.card:hover{
    transform:translateY(-10px) scale(1.05);
    box-shadow:0 15px 30px rgba(0,0,0,0.15);
}

/* ICON */
.icon{
    font-size:40px;
    margin-bottom:10px;
}

/* TEXT */
.card h2{
    font-size:26px;
    margin-bottom:5px;
}

.card p{
    font-size:14px;
    color:#666;
}

/* COLORS */
.c6{border-left:6px solid #0ea5e9;}
.c7{border-left:6px solid #f59e0b;}
.c8{border-left:6px solid #22c55e;}
.c9{border-left:6px solid #a855f7;}
.c10{border-left:6px solid #ef4444;}
.c11{border-left:6px solid #14b8a6;}
.c12{border-left:6px solid #f97316;}

/* FOOTER */
footer{
    text-align:center;
    padding:20px;
    background:#0ea5e9;
    color:white;
    margin-top:30px;
}

/* MOBILE */
@media(max-width:600px){
    .hero h1{
        font-size:32px;
    }

    header{
        flex-direction:column;
        gap:10px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">Class<span>+</span></div>
</header>

<!-- HERO -->
<section class="hero">
    <h1>📘 Choose Your Class</h1>
    <p>Select your class to access notes, PYQs, question bank and worksheets in one place.</p>
</section>

<!-- CLASS GRID -->
<section class="grid">

    <a href="subject6.html" class="card c6">
        <div class="icon">📘</div>
        <h2>Class 6</h2>
        <p>Foundation</p>
    </a>

    <a href="subject7.html" class="card c7">
        <div class="icon">📗</div>
        <h2>Class 7</h2>
        <p>Basics</p>
    </a>

    <a href="subject8.html" class="card c8">
        <div class="icon">📙</div>
        <h2>Class 8</h2>
        <p>Strong base</p>
    </a>

    <a href="subject.html" class="card c9">
        <div class="icon">📕</div>
        <h2>Class 9</h2>
        <p>Start boards</p>
    </a>

    <a href="subject10.html" class="card c10">
        <div class="icon">🎓</div>
        <h2>Class 10</h2>
        <p>Board exams</p>
    </a>

    
</section>

<!-- FOOTER -->
<footer>
    © 2026 Class+ | Learn Smart, Grow Fast
</footer>

</body>
</html>
